[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "macmini-ai-hub"
version = "0.1.0"
description = "Reproducible, secure AI agent hub for one Apple Silicon Mac mini"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mac Mini AI Hub contributors" }]
dependencies = [
  "aiohttp>=3.10,<4",
  "fastapi>=0.116,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "slack-bolt>=1.23,<2",
  "uvicorn>=0.35,<1",
]

[project.scripts]
ai-hub = "macmini_ai_hub.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/macmini_ai_hub"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = false
